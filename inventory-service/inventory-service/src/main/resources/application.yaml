
spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:postgresql://localhost:5432/orbit_inventory
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
